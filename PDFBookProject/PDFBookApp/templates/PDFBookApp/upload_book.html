<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <title>Загрузка книги</title>
</head>
<body>
    <h1>Загрузка книги</h1>
    <form method="post" enctype="multipart/form-data">
        {% csrf_token %}
        {{ form.as_p }}
        <button type="submit">Загрузить</button>
    </form>
    <p><a href="{% url 'PDFBookApp:book-list' %}">Назад к списку книг</a></p>
</body>
</html>
